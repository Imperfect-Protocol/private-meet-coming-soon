[package]
name = "sadhbh-c0d3/private-meet-nextjs"
version = "0.2.0"
description = "Private Meet (Next)"

[dependencies]
"sadhbh-c0d3/edgejs-quickjs" = "=0.1.2"

[fs]
"/app" = "./"

[[command]]
name = "run"
module = "sadhbh-c0d3/edgejs-quickjs:edge"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
main-args = ["/app/server.mjs"]
